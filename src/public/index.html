<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <title>Monster Puzzle Fight</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- CSS Files -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/player.css">
  <link rel="stylesheet" href="/css/board.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/overlay.css">
</head>
<body>
  <div id="app">
    <h1>⚔️ <span id="p1-name">???</span> vs <span id="p2-name">???</span></h1>

    <div id="status">
      <div id="connection-status">Connecting to server...<span class="loading-spinner"></span></div>
    </div>

    <div id="game-container">
      <!-- Turn Timer -->
      <div id="turn-timer-container">
        <div id="turn-timer-bar">
          <div id="turn-timer-fill"></div>
        </div>
        <div id="turn-timer-text">⏱️ 30s</div>
      </div>

      <!-- Moves Counter - At Top -->
      <div id="moves-remaining" class="moves-display">Moves: 2</div>

      <!-- Player Info - Simplified -->
      <div class="player-info">
        <div class="player" id="player1">
          <div class="sprite-container">
            <img id="p1-sprite" class="character-sprite" src="" alt="Player 1">
          </div>
          <span class="element-badge" id="p1-element-badge">?</span>
          <div class="hp-container">
            <div class="hp-bar">
              <div class="hp-fill" id="p1-hp-bar" style="width: 100%"></div>
              <span class="hp-label"><span id="p1-hp">100</span>/<span id="p1-maxhp">100</span></span>
            </div>
          </div>
          <div class="charge-bar" id="p1-charge">
            <div class="charge-pip"></div>
            <div class="charge-pip"></div>
            <div class="charge-pip"></div>
            <div class="charge-pip"></div>
            <div class="charge-pip"></div>
            <div class="charge-pip"></div>
          </div>
        </div>

        <div class="vs-divider">VS</div>

        <div class="player" id="player2">
          <div class="sprite-container">
            <img id="p2-sprite" class="character-sprite" src="" alt="Player 2">
          </div>
          <span class="element-badge" id="p2-element-badge">?</span>
          <div class="hp-container">
            <div class="hp-bar">
              <div class="hp-fill" id="p2-hp-bar" style="width: 100%"></div>
              <span class="hp-label"><span id="p2-hp">100</span>/<span id="p2-maxhp">100</span></span>
            </div>
          </div>
          <div class="charge-bar" id="p2-charge">
            <div class="charge-pip"></div>
            <div class="charge-pip"></div>
            <div class="charge-pip"></div>
            <div class="charge-pip"></div>
            <div class="charge-pip"></div>
            <div class="charge-pip"></div>
          </div>
        </div>
      </div>

      <div id="board"></div>

      <div id="message">Waiting for game to start...</div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="game-over-overlay">
    <div class="game-over-content">
      <h2 id="game-over-title">YOU WIN!</h2>
      <p id="game-over-message">Congratulations!</p>
      <button class="play-again-btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <!-- JavaScript Modules (order matters) -->
  <script src="/js/EventQueue.js"></script>
  <script src="/js/BoardModel.js"></script>
  <script src="/js/SpriteAnimator.js"></script>
  <script src="/js/BoardAnimator.js"></script>
  <script src="/js/UIManager.js"></script>
  <script src="/js/SoundManager.js"></script>
  <script src="/js/GameClient.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
