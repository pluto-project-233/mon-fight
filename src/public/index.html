<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Puzzle Fight</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- CSS Files -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/player.css">
  <link rel="stylesheet" href="/css/board.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/overlay.css">
</head>
<body>
  <div id="app">
    <h1>⚔️ MONSTER PUZZLE FIGHT</h1>

    <div id="status">
      <div id="connection-status">Connecting to server...<span class="loading-spinner"></span></div>
    </div>

    <div id="game-container">
      <!-- Turn Timer -->
      <div id="turn-timer-container">
        <div id="turn-timer-bar">
          <div id="turn-timer-fill"></div>
        </div>
        <div id="turn-timer-text">⏱️ 30s</div>
      </div>

      <!-- Player Info -->
      <div class="player-info">
        <div class="player" id="player1">
          <h3><span class="monster-icon">🐉</span> Player 1</h3>
          <div class="monster-name" id="p1-monster">Flame Dragon</div>
          <span class="element-badge FIRE" id="p1-element-badge">FIRE</span>

          <div class="hp-container">
            <div class="hp-text">
              <span>HP</span>
              <span><span id="p1-hp">100</span>/<span id="p1-maxhp">100</span></span>
            </div>
            <div class="hp-bar">
              <div class="hp-fill" id="p1-hp-bar" style="width: 100%"></div>
            </div>
          </div>

          <div class="charge-container">
            <div class="charge-text">⚡ Charge</div>
            <div class="charge-bar" id="p1-charge">
              <div class="charge-pip"></div>
              <div class="charge-pip"></div>
              <div class="charge-pip"></div>
              <div class="charge-pip"></div>
              <div class="charge-pip"></div>
              <div class="charge-pip"></div>
            </div>
          </div>
        </div>

        <div class="player" id="player2">
          <h3><span class="monster-icon">🐍</span> Player 2</h3>
          <div class="monster-name" id="p2-monster">Aqua Serpent</div>
          <span class="element-badge WATER" id="p2-element-badge">WATER</span>

          <div class="hp-container">
            <div class="hp-text">
              <span>HP</span>
              <span><span id="p2-hp">100</span>/<span id="p2-maxhp">100</span></span>
            </div>
            <div class="hp-bar">
              <div class="hp-fill" id="p2-hp-bar" style="width: 100%"></div>
            </div>
          </div>

          <div class="charge-container">
            <div class="charge-text">⚡ Charge</div>
            <div class="charge-bar" id="p2-charge">
              <div class="charge-pip"></div>
              <div class="charge-pip"></div>
              <div class="charge-pip"></div>
              <div class="charge-pip"></div>
              <div class="charge-pip"></div>
              <div class="charge-pip"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="board"></div>

      <div id="moves-remaining" class="moves-display">Moves: 2</div>
      <div id="message">Waiting for game to start...</div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="game-over-overlay">
    <div class="game-over-content">
      <h2 id="game-over-title">YOU WIN!</h2>
      <p id="game-over-message">Congratulations!</p>
      <button class="play-again-btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <script src="/game.js"></script>
</body>
</html>
